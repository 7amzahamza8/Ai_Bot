<!doctype html>
<html lang="de" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUNKE · Robotersteuerung</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- Design und Sprache vor dem ersten Zeichnen setzen, damit nichts aufblitzt -->
<script>
  (function () {
    var theme = null, lang = null;
    try { theme = localStorage.getItem("funke-theme"); lang = localStorage.getItem("funke-lang"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    if (lang !== "de" && lang !== "en") lang = "de";
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("lang", lang);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- KaTeX zeigt die Formeln schön an. Ohne Internet zeigt die Seite stattdessen normalen Text -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  /* ---------- Farben: dunkel (Standard) ---------- */
  :root {
    color-scheme: dark;
    --bg: #0a0f1f;
    --bg-grad: none;
    --panel: rgba(255,255,255,.045);
    --panel-brd: rgba(255,255,255,.09);
    --panel-shadow: none;
    --text: #e8ecff;
    --muted: #8a93b8;

    --accent: #ff6a2b;                                   /* Funke-Orange: Rahmen, Fokus, Fortschritt */
    --accent-glow: rgba(255,106,43,.45);
    --accent-grad: linear-gradient(135deg, #d81e3c, #e0561a);   /* Buttons (weißer Text) */
    --ok: #2ef2b0;
    --ok-glow: rgba(46,242,176,.5);
    --bad: #ff5d73;
    --bad-glow: rgba(255,93,115,.5);

    --field-bg: rgba(0,0,0,.25);
    --inset: rgba(0,0,0,.3);
    --chip-bg: rgba(255,255,255,.05);
    --toast-bg: #1a2140;
    --grid-line: rgba(255,255,255,.035);
    --blob-a: #ff5a2a;  --blob-a-op: .26;
    --blob-b: #1b6cff;  --blob-b-op: .30;

    --orb-1: #3a4570;  --orb-2: #151c36;  --orb-ink: #fff;
    --orb-shadow: inset 0 2px 8px rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.5);
    --led-off: #3a3f5c;
    --bar-track: rgba(255,255,255,.06);
    --pad-a: rgba(255,106,43,.16);  --pad-b: rgba(255,106,43,.03);  --pad-brd: rgba(255,106,43,.32);

    --logo-url: url("assets/logo-on-dark.png");
    --icon-url: url("assets/icon-on-dark.png");
    --logo-opacity: .10;
  }

  /* ---------- Farben: hell (Verlauf wie im Logo-Hintergrund) ---------- */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #d9dadf;
    --bg-grad: linear-gradient(100deg, #b4b6bd 0%, #d6d7dc 45%, #f6f6f8 100%);
    --panel: rgba(255,255,255,.58);
    --panel-brd: rgba(20,24,43,.12);
    --panel-shadow: 0 10px 34px -14px rgba(20,24,43,.25);
    --text: #14182b;
    --muted: #54607f;

    --accent: #c2410c;
    --accent-glow: rgba(224,86,26,.30);
    --ok: #0a7d5c;
    --ok-glow: rgba(10,125,92,.28);
    --bad: #c4182f;
    --bad-glow: rgba(196,24,47,.25);

    --field-bg: rgba(255,255,255,.75);
    --inset: rgba(255,255,255,.62);
    --chip-bg: rgba(255,255,255,.65);
    --toast-bg: #ffffff;
    --grid-line: rgba(20,24,43,.05);
    --blob-a: #ff7a1a;  --blob-a-op: .22;
    --blob-b: #5b8cff;  --blob-b-op: .18;

    --orb-1: #ffffff;  --orb-2: #bfc3cf;  --orb-ink: #2a3050;
    --orb-shadow: inset 0 2px 6px rgba(255,255,255,.9), 0 10px 26px rgba(20,24,43,.25);
    --led-off: #b3b7c6;
    --bar-track: rgba(20,24,43,.10);
    --pad-a: rgba(224,86,26,.16);  --pad-b: rgba(255,255,255,.4);  --pad-brd: rgba(194,65,12,.35);

    --logo-url: url("assets/logo-on-light.png");
    --icon-url: url("assets/icon-on-light.png");
    --logo-opacity: .10;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Cairo", system-ui, sans-serif;
    background-color: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    overflow-x: hidden;
    transition: background-color .3s ease, color .3s ease;
  }
  [hidden] { display: none !important; }

  /* ---------- Hintergrund: Raster, Lichtflecken und das Logo ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .blob.a { width: 420px; height: 420px; background: var(--blob-a); opacity: var(--blob-a-op); top: -120px; left: -80px; }
  .blob.b { width: 360px; height: 360px; background: var(--blob-b); opacity: var(--blob-b-op); bottom: -140px; right: -100px; }
  .bg-logo {
    position: absolute; inset: 0;
    background: var(--logo-url) no-repeat center 7vh / min(620px, 84vw) auto;
    opacity: var(--logo-opacity);
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ---------- Kopfzeile ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-icon { width: 58px; height: 58px; flex: none; background: var(--icon-url) center / contain no-repeat; }
  .wordmark { font-weight: 600; font-size: 1.6rem; letter-spacing: .34em; line-height: 1; margin-right: -.34em; }
  .wordmark .n { color: #ff2d3d; }
  .wordmark .k { color: #ff5a2a; }
  .wordmark .e { color: #ff7a1a; }
  .slogan { font-size: .78rem; letter-spacing: .12em; color: var(--muted); margin-top: 7px; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 999px; }
  .seg button {
    font: inherit; font-size: .8rem; font-weight: 800; letter-spacing: .06em; cursor: pointer;
    border: 0; background: transparent; color: var(--muted); padding: 5px 13px; border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent-grad); color: #fff; }
  .seg button:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn {
    width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--panel-brd); border-radius: 50%;
    transition: border-color .15s, transform .1s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn .sun { display: none; }
  :root[data-theme="dark"] .icon-btn .sun { display: block; }
  :root[data-theme="dark"] .icon-btn .moon { display: none; }

  .conn {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 999px; font-size: .85rem;
  }
  .conn input {
    background: transparent; border: 0; outline: 0; color: var(--text);
    font-family: "JetBrains Mono", monospace; font-size: .8rem; width: 170px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 10px var(--ok-glow); }
  .dot.off { background: var(--bad); box-shadow: 0 0 10px var(--bad-glow); }

  .titlebar { margin-bottom: 22px; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
  .titlebar p { color: var(--muted); font-size: .95rem; margin-top: 6px; max-width: 62ch; }

  /* ---------- Karten ---------- */
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  .grid > *, .math-grid > *, .tr-cols > * { min-width: 0; }   /* lange Inhalte dürfen die Spalte nicht aufweiten */
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--panel-brd); box-shadow: var(--panel-shadow);
    border-radius: 22px; padding: 22px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .card h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
  .card p.sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }

  /* ---------- Roboter ---------- */
  .robot { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .orb-wrap { position: relative; width: 190px; height: 190px; margin: 6px 0 18px; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--panel-brd); }
  .ring.r2 { inset: 18px; }
  .orb {
    position: absolute; inset: 36px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; color: var(--orb-ink);
    background: radial-gradient(circle at 35% 30%, var(--orb-1), var(--orb-2) 70%);
    box-shadow: var(--orb-shadow);
    transition: transform .15s ease, box-shadow .3s ease, background .3s ease;
  }
  .orb:hover { transform: scale(1.04); }
  .orb:active { transform: scale(.95); }
  .orb:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  .orb svg { width: 44px; height: 44px; }
  .orb-wrap.running .orb {
    background: radial-gradient(circle at 35% 30%, #5bffcb, #0fa97a 75%);
    box-shadow: inset 0 2px 8px rgba(255,255,255,.35), 0 0 50px var(--ok-glow);
    color: #04261c;
  }
  .orb-wrap.running .ring { border-color: var(--ok-glow); animation: pulse 2.4s ease-out infinite; }
  .orb-wrap.running .ring.r2 { animation-delay: 1.2s; }
  @keyframes pulse { 0% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1.12); opacity: 0; } }
  .orb-wrap.busy .orb { animation: busy .8s ease-in-out infinite alternate; }
  @keyframes busy { to { transform: scale(.92); } }
  .state { font-size: 1.15rem; font-weight: 800; }
  .state.on { color: var(--ok); }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }

  /* ---------- Sounds ---------- */
  .pads { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .pad {
    position: relative; overflow: hidden; text-align: left; cursor: pointer;
    background: linear-gradient(160deg, var(--pad-a), var(--pad-b));
    border: 1px solid var(--pad-brd); border-radius: 18px; padding: 16px 16px 18px;
    color: var(--text); font-family: inherit;
    transition: transform .12s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .pad:hover { border-color: var(--accent); box-shadow: 0 8px 28px -8px var(--accent-glow); transform: translateY(-2px); }
  .pad:active { transform: translateY(1px) scale(.98); }
  .pad:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .pad .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .pad .key {
    font-family: "JetBrains Mono", monospace; font-size: .75rem; color: var(--muted);
    border: 1px solid var(--panel-brd); border-bottom-width: 3px; border-radius: 7px; padding: 1px 8px;
  }
  .pad .led { width: 9px; height: 9px; border-radius: 50%; background: var(--led-off); transition: .2s; }
  .pad .name { font-size: 1.35rem; font-weight: 800; display: block; overflow-wrap: anywhere; }
  .pad .dur { font-family: "JetBrains Mono", monospace; font-size: .75rem; color: var(--muted); display: block; margin-top: 2px; }
  .pad .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--bar-track); }
  .pad .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .pad.playing { border-color: var(--accent); box-shadow: 0 0 36px -6px var(--accent-glow); }
  .pad.playing .led { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .pad.playing .bar i { animation: fill linear forwards; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  .pads .hint { grid-column: 1 / -1; margin: 0; }

  .eq { display: flex; align-items: center; justify-content: center; gap: 4px; height: 70px; margin: 22px 0 6px; }
  .eq span { width: 5px; height: 6px; border-radius: 3px; background: linear-gradient(#ff3347, #ff9a2a); transition: height .25s; }
  .eq.live span { animation: eq .7s ease-in-out infinite alternate; }
  @keyframes eq { from { height: 8px; } to { height: var(--h); } }

  .custom { display: flex; gap: 10px; margin-top: 16px; }

  /* ---------- Gemeinsame Bausteine ---------- */
  .field {
    flex: 1; width: 100%; min-width: 0; background: var(--field-bg); border: 1px solid var(--panel-brd);
    border-radius: 12px; padding: 11px 14px; color: var(--text);
    font-family: "JetBrains Mono", monospace; font-size: .9rem; outline: 0;
  }
  .field:focus { border-color: var(--accent); }
  .field::placeholder { color: var(--muted); opacity: .75; }
  .btn {
    font-family: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px;
    padding: 0 20px; background: var(--accent-grad); color: #fff; transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.ghost { background: transparent; border: 1px solid var(--panel-brd); color: var(--muted); padding: 5px 12px; font-size: .8rem; font-weight: 600; border-radius: 10px; }
  .btn.ghost:hover { color: var(--text); border-color: var(--bad); filter: none; }

  .result {
    margin-top: 16px; min-height: 110px; background: var(--inset);
    border: 1px solid var(--panel-brd); border-radius: 16px; padding: 16px 18px;
  }
  .result.err { border-color: var(--bad); }
  .result .meta { color: var(--muted); font-size: .78rem; margin-bottom: 6px; }
  .result .tex-in { color: var(--muted); overflow-x: auto; padding: 2px 0; }
  .result .tex-out { color: var(--ok); font-size: 1.35rem; overflow-x: auto; padding: 6px 0; }
  .result .plain {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px;
    font-family: "JetBrains Mono", monospace; font-size: .82rem; color: var(--muted);
  }
  .result .plain span { white-space: pre-wrap; word-break: break-all; }
  .result .errtxt { color: var(--bad); font-weight: 600; }
  .result .placeholder { color: var(--muted); opacity: .75; }

  /* ---------- Mathe-Löser ---------- */
  .math { grid-column: 1 / -1; }
  .math-grid { display: grid; grid-template-columns: 1fr 320px; gap: 22px; }
  @media (max-width: 820px) { .math-grid { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    font-family: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; color: var(--text);
    background: var(--chip-bg); border: 1px solid var(--panel-brd); border-radius: 999px;
    padding: 6px 14px; transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.active { background: var(--accent-grad); border-color: transparent; color: #fff; box-shadow: 0 0 18px -4px var(--accent-glow); }
  .math-hint { color: var(--muted); font-size: .85rem; min-height: 1.4em; margin-bottom: 10px; }
  .math-form { display: flex; flex-direction: column; gap: 10px; }
  .math-row { display: flex; gap: 10px; }
  .extras { display: flex; flex-wrap: wrap; gap: 10px; }
  .extras label { flex: 1 1 130px; display: flex; flex-direction: column; gap: 4px; font-size: .75rem; color: var(--muted); }
  .syntax { color: var(--muted); font-size: .78rem; margin-top: 2px; }

  .hist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hist-head h3 { font-size: .95rem; font-weight: 600; }
  .hist { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
  .hist-item {
    text-align: left; cursor: pointer; font-family: inherit; color: var(--text);
    background: var(--chip-bg); border: 1px solid var(--panel-brd); border-radius: 12px;
    padding: 10px 12px; transition: border-color .15s, transform .1s;
  }
  .hist-item:hover { border-color: var(--accent); }
  .hist-item:active { transform: scale(.985); }
  .hist-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hist-item .top-row { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
  .hist-item .expr, .hist-item .res { font-family: "JetBrains Mono", monospace; font-size: .8rem; word-break: break-all; }
  .hist-item .res { color: var(--ok); margin-top: 2px; }
  .hist .empty { color: var(--muted); opacity: .75; font-size: .85rem; }

  /* ---------- Übersetzer ---------- */
  .tr { grid-column: 1 / -1; }
  .tr-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tr-bar select.field { flex: 1 1 160px; cursor: pointer; }
  .tr-bar .swap { font-size: 1.1rem; padding: 8px 16px; border-radius: 12px; }
  .tr-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .tr-cols { grid-template-columns: 1fr; } }
  textarea.field { font-family: "Cairo", system-ui, sans-serif; font-size: 1rem; line-height: 1.6; min-height: 160px; resize: vertical; }
  .tr-out { margin-top: 0; min-height: 160px; }
  .tr-text { font-family: "Cairo", system-ui, sans-serif; font-size: 1.1rem; line-height: 1.7; white-space: pre-wrap; padding: 6px 0 10px; }
  .tr-copy { display: flex; justify-content: flex-end; }
  .tr-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 12px; color: var(--muted); font-size: .8rem; }
  .tr-actions .btn.ghost { padding: 10px 16px; font-size: .85rem; }
  .result .note { color: var(--muted); font-size: .78rem; margin-top: 6px; }
  .result img.plot-img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--panel-brd); background: #fff; }
  .tr-actions .btn { padding: 10px 22px; }

  /* ---------- Dateien ---------- */
  .files { grid-column: 1 / -1; }
  .drop {
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    cursor: pointer; font-family: inherit; color: var(--text); background: var(--field-bg);
    border: 2px dashed var(--pad-brd); border-radius: 18px; padding: 22px 16px;
    transition: border-color .15s, box-shadow .2s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); box-shadow: 0 0 30px -8px var(--accent-glow); }
  .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .drop:disabled { cursor: wait; opacity: .75; }
  .drop svg { width: 30px; height: 30px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .drop b { font-weight: 800; overflow-wrap: anywhere; }
  .drop small { color: var(--muted); font-size: .8rem; }
  .file-error { margin-top: 10px; color: var(--bad); font-weight: 600; font-size: .9rem; }
  .doc-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .doc-list .hint { margin: 0; }
  .doc {
    display: flex; align-items: stretch; max-width: 100%; overflow: hidden;
    background: var(--chip-bg); border: 1px solid var(--panel-brd); border-radius: 12px;
  }
  .doc.active { border-color: var(--accent); box-shadow: 0 0 18px -6px var(--accent-glow); }
  .doc-main { font: inherit; cursor: pointer; color: var(--text); background: transparent; border: 0; padding: 8px 12px; text-align: start; min-width: 0; }
  .doc-main:focus-visible, .doc-x:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .doc-main .name { display: block; font-weight: 600; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .doc-main .meta { display: block; font-size: .72rem; color: var(--muted); }
  .doc-x { border: 0; border-inline-start: 1px solid var(--panel-brd); background: transparent; color: var(--muted); cursor: pointer; padding: 0 12px; font-size: 1rem; }
  .doc-x:hover { color: var(--bad); }
  .chat-wrap { margin-top: 18px; }
  .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .chat-head h3 { font-size: .95rem; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
  .chat {
    display: flex; flex-direction: column; gap: 10px; min-height: 120px; max-height: 420px; overflow-y: auto;
    background: var(--inset); border: 1px solid var(--panel-brd); border-radius: 16px; padding: 14px;
  }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent-grad); color: #fff; border-end-end-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--chip-bg); border: 1px solid var(--panel-brd); border-end-start-radius: 4px; }
  .msg.err { align-self: flex-start; border: 1px solid var(--bad); color: var(--bad); font-weight: 600; }
  .msg.think { color: var(--muted); font-style: italic; }
  .msg-note { align-self: flex-start; font-size: .72rem; color: var(--muted); margin-top: -6px; }
  .chat .placeholder { color: var(--muted); opacity: .75; margin: auto; text-align: center; }
  .suggest { margin: 12px 0 10px; }
  .suggest:empty { display: none; }

  /* ---------- Protokoll ---------- */
  .log { grid-column: 1 / -1; }
  .log-box {
    height: 190px; overflow-y: auto; background: var(--inset); border-radius: 14px; padding: 12px 14px;
    font-family: "JetBrains Mono", monospace; font-size: .8rem;
  }
  .log-box .row { padding: 3px 0; color: var(--muted); overflow-wrap: anywhere; }
  .log-box .row b { font-weight: 600; margin: 0 6px; }
  .log-box .ok b { color: var(--ok); }
  .log-box .err b { color: var(--bad); }
  .log-box .empty { color: var(--muted); opacity: .75; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 30px); opacity: 0;
    background: var(--toast-bg); color: var(--text); border: 1px solid var(--panel-brd);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.4);
    padding: 11px 20px; border-radius: 14px; font-weight: 600; pointer-events: none; transition: .3s; z-index: 10;
    max-width: calc(100vw - 28px); text-align: center; overflow-wrap: anywhere;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.err { border-color: var(--bad); }

  @media (max-width: 520px) {
    .wrap { padding: 18px 14px 50px; }
    .card { padding: 18px; }
    .conn input { width: 140px; }
    .wordmark { font-size: 1.35rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="bg"><div class="blob a"></div><div class="blob b"></div><div class="bg-logo"></div></div>

<div class="wrap">

        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="conn" data-i18n-title="conn.title">
        <span class="dot" id="connDot"></span>
        <input id="base" spellcheck="false" data-i18n-aria-label="conn.title">
      </div>
    </div>
  </header>

  <div class="titlebar">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>

  <div class="grid">

    <section class="card robot">

      <p class="sub" data-i18n="robot.sub"></p>

        <div class="ring"></div><div class="ring r2"></div>

        </button>
      </div>
      <div class="state" id="state"></div>
      <div class="hint" id="stateHint"></div>
    </section>

    <!-- Sounds -->
    <section class="card">
      <h2 data-i18n="sounds.title"></h2>

    <!-- Mathe-Löser -->

          </form>
          <div class="result" id="result" aria-live="polite"></div>
        </div>

            <button class="btn ghost" id="histClear" type="button" data-i18n="math.clear"></button>
          </div>
          <div class="hist" id="hist"></div>
        </div>
      </div>
    </section>

    <!-- Übersetzer -->
    <section class="card tr">
      <h2 data-i18n="tr.title"></h2>
      <p class="sub" data-i18n="tr.sub"></p>

      </div>

        <input type="file" id="docFile" hidden accept=".txt,.md,.csv,.json,.html,.htm,.pdf,.docx,.pptx,.xlsx,.odt">
        <button class="btn" id="trBtn" type="button" data-i18n="tr.go"></button>

    </section>

      <p class="sub" data-i18n="files.sub"></p>

        <small id="dropHint"></small>

        </form>

    </section>

      "chat.sugPoints": "List the key points",
      "chat.sugLang": "What language is the file written in?",

      "log.title": "Log",
      "log.sub": "Every request to the API and its response",
      "log.empty": "No requests yet."
    },
  };

  // ============================================================
  //  Zustand, Speicher und Hilfsfunktionen
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };
  const state = {
    lang: document.documentElement.getAttribute("lang") === "en" ? "en" : "de",
    theme: document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark",
  };

  // Text holen. Fehlt der Schlüssel, kommt der Schlüssel selbst zurück (fällt sofort auf)
  function t(key, vars) {
    let s = (I18N[state.lang] && I18N[state.lang][key]) || I18N.de[key] || key;
    if (vars) for (const [k, v] of Object.entries(vars)) s = s.split("{" + k + "}").join(v);
    return s;
  }
  function has(key) { return Boolean(I18N[state.lang] && I18N[state.lang][key]); }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function listJoin(items) {
    try { return new Intl.ListFormat(state.lang, { style: "long", type: "conjunction" }).format(items); }
    catch { return items.join(", "); }
  }

  const baseInput = $("base");
  baseInput.value = location.protocol === "file:" ? "http://localhost:8000" : location.origin;
  const base = () => baseInput.value.trim().replace(/\/+$/, "");

  function toast(msg, isErr = false) {
    const box = $("toast");
    box.textContent = msg;
    box.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => (box.className = "toast"), 2400);
  }

  // ---------- Protokoll ----------
  function log(kind, method, path, text) {
    const box = $("log");
    const empty = box.querySelector(".empty");
    if (empty) empty.remove();
    const time = new Date().toLocaleTimeString(state.lang === "de" ? "de-DE" : "en-GB");
    const row = el("div", "row " + kind);
    row.append(time, el("b", "", method), path + " → " + text);
    row.dataset.row = "1";
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }
  function renderLogEmpty() {
    const box = $("log");
    if (!box.querySelector("[data-row]")) {
      box.replaceChildren(el("div", "empty", t("log.empty")));
    }
  }

  // ---------- API ----------
  async function api(path, { method = "GET", body, raw } = {}) {
    try {
      const res = await fetch(base() + path, {
        method,
        headers: raw ? { "Content-Type": "application/octet-stream" } : body ? { "Content-Type": "application/json" } : undefined,
        body: raw ? raw : body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      setConn(true);
      if (!res.ok) {
        const msg = typeof data.detail === "string" ? data.detail : t("err.invalid", { status: res.status });
        log("err", method, path, msg);
        const e = new Error(msg); e.status = res.status; throw e;
      }
      const shown = JSON.stringify(data);
      log("ok", method, path, shown.length > 160 ? shown.slice(0, 157) + "…" : shown);
      return data;
    } catch (e) {
      if (e.status === undefined) { setConn(false); log("err", method, path, t("err.noAnswer")); }
      throw e;
    }
  }
  function setConn(ok) { $("connDot").className = "dot " + (ok ? "on" : "off"); }
  async function ping() {
    try { await fetch(base() + "/openapi.json"); setConn(true); }
    catch { setConn(false); }
  }

  function copyText(text) {
    const done = () => toast(t("copy.ok"));
    const fail = () => toast(t("copy.fail"), true);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fail);
      return;
    }
    const ta = document.createElement("textarea");   // Ersatz für http-Adressen im Netzwerk
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy") ? done() : fail(); } catch { fail(); }
    ta.remove();
  }

  // ============================================================
  //  Roboter
  // ============================================================
  const robot = { running: false, hint: null };   // hint = Textschlüssel
  function renderRobot() {
    $("orbWrap").classList.toggle("running", robot.running);
    const st = $("state");
    st.textContent = t(robot.running ? "robot.on" : "robot.off");
    st.classList.toggle("on", robot.running);
    $("stateHint").textContent = t(robot.hint || (robot.running ? "robot.hintOn" : "robot.hintOff"));
  }
  function setRunning(running, hintKey) {
    robot.running = running;
    robot.hint = hintKey || null;
    renderRobot();
  }

  $("orb").addEventListener("click", async () => {
    const wrap = $("orbWrap");
    wrap.classList.add("busy");
    try {
      if (!robot.running) {
        const d = await api("/hi");
        const already = d.status === "robot is already running";
        setRunning(true, already ? "robot.hintWas" : "robot.hintStarted");
        toast(t(already ? "robot.toastAlready" : "robot.toastStarted"));
      } else {
        await api("/bye");
        setRunning(false, "robot.hintStop");
        toast(t("robot.toastStopping"));
      }
    } catch {
      toast(t("err.server"), true);
    } finally {
      wrap.classList.remove("busy");
    }
  });

  // ============================================================
  //  Sounds (Liste kommt vom Backend: GET /sounds)
  // ============================================================
  // Nur ein Ersatz, falls /sounds nicht antwortet. Normalerweise kommt alles aus sound.py
  const FALLBACK_SOUNDS = [
    { word: "Hamza", dur: 4 },
    { word: "Ahmed", dur: 4 },
    { word: "hi", dur: 3 },
  ];
  let sounds = FALLBACK_SOUNDS;
  const padsEl = $("pads");

  // Wellen-Anzeige
  const eq = $("eq");
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("span");
    s.style.setProperty("--h", 14 + Math.round(Math.abs(Math.sin(i * 0.55)) * 52) + "px");
    s.style.animationDelay = (i % 9) * 0.07 + "s";
    eq.appendChild(s);
  }
  let eqTimer;
  function eqLive(seconds) {
    eq.classList.add("live");
    clearTimeout(eqTimer);
    eqTimer = setTimeout(() => eq.classList.remove("live"), seconds * 1000);
  }

  function renderSounds() {
    padsEl.replaceChildren();
    $("soundsSub").textContent = sounds.length
      ? t("sounds.sub", { keys: listJoin(sounds.slice(0, 9).map((_, i) => String(i + 1))) })
      : "";
    if (!sounds.length) { padsEl.appendChild(el("p", "hint", t("sounds.empty"))); return; }
    sounds.forEach((s, i) => {
      const b = el("button", "pad");
      b.type = "button";
      b.dataset.word = s.word;
      const top = el("div", "top-row");
      top.append(el("span", "led"), el("span", "key", String(i + 1)));
      const bar = el("div", "bar");
      bar.appendChild(document.createElement("i"));
      b.append(top, el("span", "name", s.word), el("span", "dur", s.dur + " s"), bar);
      b.addEventListener("click", () => play(s.word, s.dur, b));
      padsEl.appendChild(b);
    });
  }

  async function loadSounds() {
    try {
      const list = await api("/sounds");
      if (Array.isArray(list)) {
        sounds = list.map((s) => ({ word: String(s.word), dur: Number(s.duration) || 3 }));
      }
    } catch { /* bleibt bei der Ersatzliste */ }
    renderSounds();
  }

  async function play(word, dur = 3, padEl = null) {
    try {
      await api("/play/" + encodeURIComponent(word));
      eqLive(dur);
      if (padEl) {
        const bar = padEl.querySelector(".bar i");
        padEl.classList.remove("playing");
        void padEl.offsetWidth;               // startet die Animation neu
        bar.style.animationDuration = dur + "s";
        padEl.classList.add("playing");
        clearTimeout(padEl._t);
        padEl._t = setTimeout(() => padEl.classList.remove("playing"), dur * 1000);
      }
    } catch (e) {
      toast(t(e.status === 404 ? "sounds.notFound" : "err.server"), true);
    }
  }

  $("customForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const typed = $("customWord").value.trim();
    if (!typed) return;
    // Groß-/Kleinschreibung egal: "hamza" findet "Hamza". Gesendet wird die Schreibweise aus dem Backend
    const known = sounds.find((s) => s.word.toLowerCase() === typed.toLowerCase());
    const pad = known ? [...padsEl.children].find((p) => p.dataset.word === known.word) : null;
    play(known ? known.word : typed, known ? known.dur : 3, pad || null);
    $("customWord").value = "";
  });

  document.addEventListener("keydown", (e) => {
    if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    const i = parseInt(e.key, 10) - 1;
    if (i >= 0 && i < sounds.length) {
      const pad = padsEl.children[i];
      if (pad && pad.classList.contains("pad")) pad.click();
    }
  });

  // ============================================================
  //  Mathe-Löser
  // ============================================================
  const EXAMPLES = {
    solve: "x^2 - 5x + 6 = 0", simplify: "sin(x)^2 + cos(x)^2", expand: "(x+1)^3",
    factor: "x^3 - 1", diff: "x^2 * sin(x)", integrate: "x * exp(x)",
    limit: "sin(x) / x", evalf: "sqrt(2) + pi",
  };
  const EXTRA_FIELDS = ["variable", "point", "lower", "upper"];
  const MAX_HISTORY = 50;

  let operations = [];
  let currentOp = "solve";
  let historyItems = [];
  let mathView = { kind: "placeholder" };

  const mathExpr = $("mathExpr");
  const extraInputs = {};
  for (const field of EXTRA_FIELDS) {
    const lab = el("label");
    lab.dataset.field = field;
    lab.appendChild(el("span"));
    const inp = el("input", "field");
    inp.spellcheck = false;
    inp.autocomplete = "off";
    lab.appendChild(inp);
    $("extras").appendChild(lab);
    extraInputs[field] = inp;
  }
  function renderExtras() {
    for (const field of EXTRA_FIELDS) {
      const lab = $("extras").querySelector(`[data-field="${field}"]`);
      lab.firstChild.textContent = t("extra." + field + ".label");
      extraInputs[field].placeholder = t("extra." + field + ".ph");
    }
  }

  // Name der Rechenart in der gewählten Sprache (Ersatz: Name vom Backend)
  function opLabel(id, fallback) {
    const key = "op." + id + ".label";
    return has(key) ? t(key) : (fallback || id);
  }
  function opHint(id, fallback) {
    const key = "op." + id + ".hint";
    return has(key) ? t(key) : (fallback || "");
  }

  function texInto(box, latex, fallback) {
    if (window.katex && latex) {
      try { katex.render(latex, box, { throwOnError: false }); return; } catch {}
    }
    box.textContent = fallback;
  }

  function selectOp(id) {
    currentOp = id;
    const op = operations.find((o) => o.id === id);
    document.querySelectorAll(".chip").forEach((c) => {
      const on = c.dataset.op === id;
      c.classList.toggle("active", on);
      c.setAttribute("aria-pressed", String(on));
    });
    $("mathHint").textContent = op ? opHint(id, op.hint) : "";
    mathExpr.placeholder = t("math.eg", { example: EXAMPLES[id] || "x^2 - 4" });
    const needs = op ? op.needs : [];
    document.querySelectorAll("#extras label").forEach((l) => { l.hidden = !needs.includes(l.dataset.field); });
    $("extras").hidden = needs.length === 0;
  }

  function renderChips() {
    const box = $("chips");
    box.replaceChildren();
    for (const op of operations) {
      const b = el("button", "chip", opLabel(op.id, op.label));
      b.type = "button";
      b.dataset.op = op.id;
      b.addEventListener("click", () => selectOp(op.id));
      box.appendChild(b);
    }
    selectOp(operations.some((o) => o.id === currentOp) ? currentOp : (operations[0] && operations[0].id));
  }

  // Ergebnisfeld: der Zustand wird gemerkt, damit ein Sprachwechsel es neu zeichnen kann
  function setMathView(view) { mathView = view; renderMathView(); }
  function renderMathView() {
    const box = $("result");
    box.className = "result" + (mathView.kind === "error" ? " err" : "");
    box.replaceChildren();
    if (mathView.kind === "placeholder") {
      box.appendChild(el("div", "placeholder", t("math.placeholder")));
    } else if (mathView.kind === "error") {
      box.appendChild(el("div", "errtxt", mathView.key ? t(mathView.key) : mathView.msg));
    } else if (mathView.kind === "plot") {
      const img = el("img", "plot-img");
      img.src = mathView.image;
      img.alt = t("math.plotAlt");
      box.appendChild(img);
    } else {
      const entry = mathView.entry;
      const none = entry.kind === "no_solution";
      const plainText = none ? t("math.noSolution") : entry.result;
      const tin = el("div", "tex-in");
      texInto(tin, entry.input_latex, entry.expression);
      const tout = el("div", "tex-out");
      if (none) tout.textContent = plainText; else texInto(tout, entry.latex, entry.result);
      const plain = el("div", "plain");
      const cp = el("button", "btn ghost", t("copy.btn"));
      cp.type = "button";
      cp.addEventListener("click", () => copyText(plainText));
      plain.append(el("span", "", plainText), cp);
      box.append(el("div", "meta", opLabel(entry.operation, entry.operation_label) + " · " + entry.time), tin, tout, plain);
    }
  }

  function loadEntry(it) {
    selectOp(it.operation);
    mathExpr.value = it.expression;
    for (const f of EXTRA_FIELDS) extraInputs[f].value = (it.params && it.params[f]) || "";
    setMathView({ kind: "result", entry: it });
    mathExpr.focus();
  }

  function renderHistory() {
    const list = $("hist");
    list.replaceChildren();
    if (!historyItems.length) { list.appendChild(el("div", "empty", t("math.historyEmpty"))); return; }
    for (const it of historyItems) {
      const b = el("button", "hist-item");
      b.type = "button";
      const top = el("div", "top-row");
      top.append(el("span", "", opLabel(it.operation, it.operation_label)), el("span", "", it.time));
      const shown = it.kind === "no_solution" ? t("math.noSolution") : it.result.replace(/\n/g, "  |  ");
      b.append(top, el("div", "expr", it.expression), el("div", "res", "= " + shown));
      b.addEventListener("click", () => loadEntry(it));
      list.appendChild(b);
    }
  }

  async function loadMath() {
    try {
      operations = await api("/math/operations");
      renderChips();
      historyItems = await api("/math/history");
      renderHistory();
    } catch {
      $("mathHint").textContent = t("math.loadFailed");
    }
  }

  $("mathForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const expression = mathExpr.value.trim();
    if (!expression) { setMathView({ kind: "error", key: "math.enter" }); return; }
    const op = operations.find((o) => o.id === currentOp);
    if (!op) { setMathView({ kind: "error", key: "math.notLoaded" }); loadMath(); return; }

    const body = { expression, operation: currentOp, lang: state.lang };
    for (const f of op.needs) {
      const v = extraInputs[f].value.trim();
      if (v) body[f] = v;
    }

    const btn = $("mathBtn");
    btn.disabled = true;
    try {
      const entry = await api("/math/solve", { method: "POST", body });
      setMathView({ kind: "result", entry });
      historyItems.unshift(entry);
      historyItems = historyItems.slice(0, MAX_HISTORY);
      renderHistory();
    } catch (err) {
      setMathView(err.status === 400 ? { kind: "error", msg: err.message } : { kind: "error", key: "err.server" });
    } finally {
      btn.disabled = false;
    }
  });

  // Graph der Funktion (GET /math/plot). Die Variable kommt aus dem Feld "Variable", wenn es sichtbar ist
  $("mathPlotBtn").addEventListener("click", async () => {
    const expression = mathExpr.value.trim();
    if (!expression) { setMathView({ kind: "error", key: "math.enter" }); return; }
    const variable = extraInputs.variable.offsetParent !== null ? extraInputs.variable.value.trim() : "";
    const btn = $("mathPlotBtn");
    btn.disabled = true;
    try {
      const path = `/math/plot?expression=${encodeURIComponent(expression)}&var=${encodeURIComponent(variable || "x")}&lang=${state.lang}`;
      const data = await api(path);
      setMathView({ kind: "plot", image: data.image });
    } catch (err) {
      setMathView(err.status === 400 ? { kind: "error", msg: err.message } : { kind: "error", key: "err.server" });
    } finally {
      btn.disabled = false;
    }
  });

  $("histClear").addEventListener("click", async () => {
    try {
      await api("/math/history", { method: "DELETE" });
      historyItems = [];
      renderHistory();
      toast(t("math.historyCleared"));
    } catch {
      toast(t("err.server"), true);
    }
  });

  // ============================================================
  //  Übersetzer
  // ============================================================
  const trSource = $("trSource");
  const trTarget = $("trTarget");
  const trInput = $("trInput");
  const trBtn = $("trBtn");
  let trMax = 1000;
  let trLanguages = [];
  let trView = { kind: "placeholder" };
  let lastTranslation = "";

  function updateCount() { $("trCount").textContent = trInput.value.length + " / " + trMax; }

  function setTrView(view) { trView = view; renderTrView(); }
  function renderTrView() {
    const box = $("trOut");
    box.className = "result tr-out" + (trView.kind === "error" ? " err" : "");
    box.replaceChildren();
    if (trView.kind === "placeholder") {
      box.appendChild(el("div", "placeholder", t("tr.placeholder")));
    } else if (trView.kind === "busy") {
      box.appendChild(el("div", "placeholder", t("tr.busy")));
    } else if (trView.kind === "error") {
      box.appendChild(el("div", "errtxt", trView.key ? t(trView.key) : trView.msg));
    } else {
      const out = el("div", "tr-text", trView.translation);
      out.dir = trView.target === "ar" ? "rtl" : "ltr";
      const cp = el("button", "btn ghost", t("copy.btn"));
      cp.type = "button";
      cp.addEventListener("click", () => copyText(trView.translation));
      const row = el("div", "tr-copy");
      row.appendChild(cp);
      box.append(el("div", "meta", "→ " + languageName(trView.target)), out);
      if (trView.truncated) box.appendChild(el("div", "note", t("tr.docNote", { done: fmtNum(trView.done), total: fmtNum(trView.total) })));
      box.appendChild(row);
    }
  }

  function languageName(code, fallback) {
    const key = "language." + code;
    return has(key) ? t(key) : (fallback || code);
  }

  function fillLanguages(select, withAuto) {
    const keep = select.value;
    select.replaceChildren();
    if (withAuto) {
      const o = el("option", "", t("tr.auto"));
      o.value = "auto";
      select.appendChild(o);
    }
    for (const l of trLanguages) {
      const o = el("option", "", languageName(l.code, l.label));
      o.value = l.code;
      select.appendChild(o);
    }
    if (keep && [...select.options].some((o) => o.value === keep)) select.value = keep;
  }

  async function loadTranslator() {
    try {
      const info = await api("/translate/languages");
      const firstLoad = trTarget.options.length === 0;
      trMax = info.max_length;
      trInput.maxLength = trMax;
      trLanguages = info.languages;
      fillLanguages(trSource, true);
      fillLanguages(trTarget, false);
      if (firstLoad && trLanguages.some((l) => l.code === "de")) trTarget.value = "de";
      updateCount();
    } catch {
      setTrView({ kind: "error", key: "tr.loadFailed" });
    }
  }

  async function doTranslate() {
    const text = trInput.value.trim();
    if (!text) { setTrView({ kind: "error", key: "tr.enter" }); return; }
    const source = trSource.value;
    const target = trTarget.value;
    if (!target) { setTrView({ kind: "error", key: "tr.notLoaded" }); loadTranslator(); return; }
    if (source === target) { setTrView({ kind: "error", key: "tr.same" }); return; }

    trBtn.disabled = true;
    setTrView({ kind: "busy" });
    try {
      const d = await api("/translate", { method: "POST", body: { text, source, target, lang: state.lang } });
      lastTranslation = d.translation;
      setTrView({ kind: "result", translation: d.translation, target });
    } catch (err) {
      setTrView(err.status === 400 || err.status === 503 ? { kind: "error", msg: err.message } : { kind: "error", key: "err.server" });
    } finally {
      trBtn.disabled = false;
    }
  }

  // Datei übersetzen (POST /translate/document, rohe Bytes). Zeigt auch Fehler und Kürzung an
  async function translateFile(file) {
    const source = trSource.value;
    const target = trTarget.value;
    if (!target) { setTrView({ kind: "error", key: "tr.notLoaded" }); loadTranslator(); return; }
    if (source === target) { setTrView({ kind: "error", key: "tr.same" }); return; }
    if (file.size > filesState.max * 1024 * 1024) {
      setTrView({ kind: "error", msg: t("files.tooBig", { name: file.name, mb: filesState.max }) });
      return;
    }
    trBtn.disabled = $("docBtn").disabled = true;
    setTrView({ kind: "busy" });
    try {
      const path = `/translate/document?name=${encodeURIComponent(file.name)}&target=${target}&source=${source}&lang=${state.lang}`;
      const d = await api(path, { method: "POST", raw: file });
      lastTranslation = d.translation;
      setTrView({ kind: "result", translation: d.translation, target, truncated: d.truncated, done: d.chars_done, total: d.chars_total });
    } catch (err) {
      setTrView(err.status ? { kind: "error", msg: err.message } : { kind: "error", key: "err.server" });
    } finally {
      trBtn.disabled = $("docBtn").disabled = false;
    }
  }
  $("docBtn").addEventListener("click", () => $("docFile").click());
  $("docFile").addEventListener("change", () => {
    const file = $("docFile").files[0];
    $("docFile").value = "";       // damit dieselbe Datei nochmal gewählt werden kann
    if (file) translateFile(file);
  });

  trBtn.addEventListener("click", doTranslate);
  trInput.addEventListener("input", updateCount);
  trInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doTranslate(); }
  });

  $("trSwap").addEventListener("click", () => {
    if (trSource.value === "auto") { toast(t("tr.swapAuto"), true); return; }
    [trSource.value, trTarget.value] = [trTarget.value, trSource.value];
    if (lastTranslation) {          // die Übersetzung wird zum neuen Eingabetext
      trInput.value = lastTranslation;
      lastTranslation = "";
      setTrView({ kind: "placeholder" });
      updateCount();
    }
  });

  // ============================================================
  //  Dateien: hochladen und Fragen stellen
  // ============================================================
  const filesState = {
    max: 10, maxQ: 1000, pdf: true,
    docs: [], activeId: null,
    chats: {},          // pro Datei: [{ role: "user" | "bot" | "err", text | key, excerpted }]
    pendingId: null,    // Datei, bei der gerade eine Antwort berechnet wird
    uploading: null,    // Name der Datei, die gerade hochgeladen wird
    error: null,        // { msg } vom Server oder { key, vars }
  };
  const dropBtn = $("drop"), fileInput = $("fileInput"), askInput = $("askInput"), askBtn = $("askBtn");
  const activeDoc = () => filesState.docs.find((d) => d.id === filesState.activeId) || null;

  const fmtNum = (n, digits = 0) => new Intl.NumberFormat(state.lang, { maximumFractionDigits: digits }).format(n);
  function fmtSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return fmtNum(n / 1024) + " KB";
    return fmtNum(n / (1024 * 1024), 1) + " MB";
  }

  function renderFiles() {
    const f = filesState;
    $("dropTitle").textContent = f.uploading ? t("files.uploading", { name: f.uploading }) : t("files.drop");
    $("dropHint").textContent = t("files.hint", { mb: f.max }) + (f.pdf ? "" : " · " + t("files.noPdf"));
    dropBtn.disabled = Boolean(f.uploading);

    const err = $("fileError");
    err.hidden = !f.error;
    if (f.error) err.textContent = f.error.msg || t(f.error.key, f.error.vars);

    const list = $("docList");
    list.replaceChildren();
    if (!f.docs.length) list.appendChild(el("div", "hint", t("files.empty")));
    for (const d of f.docs) {
      const isActive = d.id === f.activeId;
      const box = el("div", "doc" + (isActive ? " active" : ""));
      const main = el("button", "doc-main");
      main.type = "button";
      main.title = d.name;
      main.setAttribute("aria-pressed", String(isActive));
      const name = el("span", "name", d.name);
      name.dir = "auto";
      main.append(name, el("span", "meta",
        fmtSize(d.size) + " · " + t("files.chars", { n: fmtNum(d.chars) }) + (d.truncated ? " · " + t("files.truncated") : "")));
      main.addEventListener("click", () => selectDoc(d.id));
      const x = el("button", "doc-x", "✕");
      x.type = "button";
      x.title = t("files.remove", { name: d.name });
      x.setAttribute("aria-label", x.title);
      x.addEventListener("click", () => removeDoc(d.id));
      box.append(main, x);
      list.appendChild(box);
    }

    const doc = activeDoc();
    $("chatWrap").hidden = !doc;
    if (!doc) return;
    const busy = f.pendingId !== null;
    $("chatTitle").textContent = t("chat.title", { name: doc.name });
    const chat = $("chat");
    const messages = f.chats[doc.id] || [];
    chat.replaceChildren();
    if (!messages.length && f.pendingId !== doc.id) chat.appendChild(el("div", "placeholder", t("chat.empty")));
    for (const m of messages) {
      const bubble = el("div", "msg " + m.role, m.text !== undefined ? m.text : t(m.key));
      bubble.dir = "auto";
      chat.appendChild(bubble);
      if (m.excerpted) chat.appendChild(el("div", "msg-note", t("chat.excerpted")));
    }
    if (f.pendingId === doc.id) chat.appendChild(el("div", "msg bot think", t("chat.thinking")));
    chat.scrollTop = chat.scrollHeight;

    const suggest = $("suggest");
    suggest.replaceChildren();
    for (const key of ["chat.sugSummary", "chat.sugPoints", "chat.sugLang"]) {
      const chip = el("button", "chip", t(key));
      chip.type = "button";
      chip.disabled = busy;
      chip.addEventListener("click", () => ask(t(key)));
      suggest.appendChild(chip);
    }
    askInput.disabled = askBtn.disabled = busy;
    askInput.maxLength = f.maxQ;
  }

  async function loadDocs() {
    const f = filesState;
    try {
      f.docs = await api("/files");
    } catch {
      f.error = { key: "files.loadFailed" };
      renderFiles();
      return;
    }
    for (const id of Object.keys(f.chats)) if (!f.docs.some((d) => String(d.id) === id)) delete f.chats[id];
    if (!activeDoc()) {
      f.activeId = null;
      if (f.docs.length) { await selectDoc(f.docs[0].id); return; }
    }
    renderFiles();
  }

  async function loadFiles() {
    try {
      const info = await api("/files/info");
      filesState.max = info.max_mb;
      filesState.maxQ = info.max_question;
      filesState.pdf = info.pdf;
      filesState.error = null;
    } catch {
      filesState.error = { key: "files.loadFailed" };
      renderFiles();
      return;
    }
    await loadDocs();
  }

  async function selectDoc(id) {
    const f = filesState;
    f.activeId = id;
    const known = Array.isArray(f.chats[id]);
    if (!known) f.chats[id] = [];
    renderFiles();
    if (known) return;
    try {
      const d = await api(`/files/${id}?lang=${state.lang}`);
      if (f.chats[id] && !f.chats[id].length) {
        f.chats[id] = d.chat.map((m) => ({ role: m.role === "assistant" ? "bot" : "user", text: m.content }));
      }
    } catch (err) {
      if (err.status === 404) { await loadDocs(); return; }
    }
    renderFiles();
  }

  async function removeDoc(id) {
    const f = filesState;
    try {
      await api(`/files/${id}?lang=${state.lang}`, { method: "DELETE" });
    } catch (err) {
      if (err.status !== 404) { toast(err.status ? err.message : t("err.server"), true); return; }
    }
    delete f.chats[id];
    f.docs = f.docs.filter((d) => d.id !== id);
    if (f.activeId === id) {
      f.activeId = null;
      if (f.docs.length) { await selectDoc(f.docs[0].id); }
    }
    renderFiles();
    toast(t("files.removed"));
  }

  async function uploadFiles(fileList) {
    const f = filesState;
    const files = [...fileList];       // FileList wird geleert, sobald der Input zurückgesetzt wird
    fileInput.value = "";
    if (f.uploading) return;
    for (const file of files) {
      f.error = null;
      if (file.size > f.max * 1024 * 1024) {
        f.error = { key: "files.tooBig", vars: { name: file.name, mb: f.max } };
        renderFiles();
        continue;
      }
      f.uploading = file.name;
      renderFiles();
      try {
        const meta = await api(`/files/upload?name=${encodeURIComponent(file.name)}&lang=${state.lang}`, { method: "POST", raw: file });
        f.chats[meta.id] = [];
        f.activeId = meta.id;
        await loadDocs();
        toast(t("files.uploaded", { name: meta.name }));
      } catch (err) {
        f.error = err.status ? { msg: err.message } : { key: "err.server" };
      } finally {
        f.uploading = null;
      }
      renderFiles();
    }
  }

  async function ask(question) {
    const f = filesState;
    question = (question || "").trim();
    const id = f.activeId;
    if (!question || id === null || f.pendingId !== null) return;
    const chat = f.chats[id];
    chat.push({ role: "user", text: question });
    f.pendingId = id;
    askInput.value = "";
    renderFiles();
    try {
      const d = await api("/files/ask", { method: "POST", body: { doc_id: id, question, lang: state.lang } });
      chat.push({ role: "bot", text: d.answer, excerpted: d.excerpted });
    } catch (err) {
      chat.push(err.status ? { role: "err", text: err.message } : { role: "err", key: "err.server" });
      if (err.status === 404) { f.pendingId = null; await loadDocs(); }
    } finally {
      f.pendingId = null;
    }
    renderFiles();
  }

  $("askForm").addEventListener("submit", (e) => { e.preventDefault(); ask(askInput.value); });
  $("chatNew").addEventListener("click", async () => {
    const id = filesState.activeId;
    if (id === null) return;
    try {
      await api(`/files/${id}/chat?lang=${state.lang}`, { method: "DELETE" });
      filesState.chats[id] = [];
      renderFiles();
      toast(t("chat.cleared"));
    } catch (err) {
      toast(err.status ? err.message : t("err.server"), true);
    }
  });

  dropBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { if (fileInput.files.length) uploadFiles(fileInput.files); });

  // Ziehen und Ablegen: überall auf der Seite (sonst würde der Browser die Datei öffnen)
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { e.preventDefault(); dropBtn.classList.add("over"); } });
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); dropBtn.classList.add("over"); } });
  window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) dropBtn.classList.remove("over"); });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dropBtn.classList.remove("over");
    if (e.dataTransfer.files.length) {
      $("filesCard").scrollIntoView({ behavior: "smooth", block: "start" });
      uploadFiles(e.dataTransfer.files);
    }
  });

  // ============================================================
  //  Sprache und Design
  // ============================================================
  function applyLang(lang) {
    state.lang = lang === "en" ? "en" : "de";
    document.documentElement.setAttribute("lang", state.lang);
    store.set("funke-lang", state.lang);
    document.title = "FUNKE · " + t("title");
    document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((n) => { n.placeholder = t(n.dataset.i18nPlaceholder); });
    document.querySelectorAll("[data-i18n-aria-label]").forEach((n) => { n.setAttribute("aria-label", t(n.dataset.i18nAriaLabel)); });
    document.querySelectorAll("[data-i18n-title]").forEach((n) => { n.title = t(n.dataset.i18nTitle); });
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
    applyTheme(state.theme, false);

    // alles, was aus Code gezeichnet wird, neu zeichnen
    renderRobot();
    renderSounds();
    renderExtras();
    if (operations.length) renderChips();
    renderHistory();
    renderMathView();
    if (trLanguages.length) { fillLanguages(trSource, true); fillLanguages(trTarget, false); }
    renderTrView();
    renderFiles();
    renderLogEmpty();
  }

  function applyTheme(theme, save = true) {
    state.theme = theme === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", state.theme);
    if (save) store.set("funke-theme", state.theme);
    const label = t(state.theme === "dark" ? "theme.toLight" : "theme.toDark");
    $("themeBtn").setAttribute("aria-label", label);
    $("themeBtn").title = label;
  }

  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));
  $("themeBtn").addEventListener("click", () => applyTheme(state.theme === "dark" ? "light" : "dark"));
  baseInput.addEventListener("change", () => { ping(); loadMath(); loadTranslator(); loadSounds(); loadFiles(); });

  // ---------- Start ----------
  applyLang(state.lang);
  ping();
  loadMath();
  loadTranslator();
  loadSounds();
  loadFiles();
</script>
</body>
</html>
